<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karte — Bow &amp; Arrow</title>
<meta name="robots" content="noindex, nofollow">
<!--
  Vorlage für assets/work-bow-and-arrow.webp — gerendert von
  tools/build-cards.sh. Nichts hier ist Teil der Website.

  Farben und Maße kommen aus dem Design-System des Spiels
  (bow-and-arrow/_ds/…/tokens/), das seinerseits Theme.swift spiegelt:
    --ba-gold        #BF993F   heraldisches Gold, die Markenfarbe
    --ba-bg          #0A0E18   bläuliches Fast-Schwarz
    --text-3xl       76px      „marketing display"
    --tracking-caps  2px
  VT323 ist laut Design-System die Anzeigeschrift; Press Start 2P ist
  ausdrücklich nur für kurze Akzente gedacht.
-->
<link rel="stylesheet" href="../../bow-and-arrow/assets/fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 750px;
    display: grid; place-items: center;
    background:
      radial-gradient(78% 62% at 50% 34%, rgba(191, 153, 63, .17), transparent 68%),
      radial-gradient(130% 108% at 50% 26%, #131a2c 0%, #0a0e18 54%, #080c14 100%);
    overflow: hidden;
  }

  .card { display: grid; justify-items: center; gap: 54px; }

  /* Der Löwe steht als App-Symbol da, nicht als Bild im Bild:
     abgerundetes Quadrat, dünner Goldrand, Schatten darunter. */
  .tile {
    position: relative;
    width: 384px; height: 384px;
    border-radius: 22%;
    overflow: hidden;
    box-shadow:
      0 30px 70px -16px rgba(0, 0, 0, .85),
      0 0 0 1px rgba(191, 153, 63, .3),
      0 0 90px -24px rgba(191, 153, 63, .5);
  }
  .tile img { display: block; width: 100%; height: 100%; }
  /* Feiner Lichtstreif oben — Metall unter Fackellicht. */
  .tile::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(168deg, rgba(255, 248, 230, .1) 0%, transparent 34%);
  }

  .word {
    font-family: "VT323", "Courier New", monospace;
    font-size: 76px;
    line-height: 1;
    letter-spacing: 2px;
    color: #e0c266;
    /* Die schwarze Pixelkontur, die im Spiel auf allen Glyphen sitzt. */
    text-shadow: 0 4px 0 #1a1208, 0 0 34px rgba(191, 153, 63, .45);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tile">
      <img src="../../bow-and-arrow/assets/ds/app-icon-dark.png" alt="">
    </div>
    <div class="word">BOW &amp; ARROW</div>
  </div>
</body>
</html>
