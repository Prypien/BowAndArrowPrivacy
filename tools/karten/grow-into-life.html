<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karte — Grow into Life</title>
<meta name="robots" content="noindex, nofollow">
<!--
  Vorlage für assets/work-grow-into-life.webp — gerendert von
  tools/build-cards.sh. Nichts hier ist Teil der Website.

  Farben aus grow-into-life/app.css, das AppTheme.swift spiegelt:
    AppBackground #FFF8F1   warmes Creme
    AppText       #3E442E   dunkles Oliv
    AppAccent     #98A68F   Salbeigrün
  Die App läuft nur in Hell — die Karte deshalb auch. Sie ist damit
  der bewusste Gegensatz zur Bow-&-Arrow-Karte, so wie die beiden
  Apps es auch sind.
-->
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 750px;
    display: grid; place-items: center;
    background:
      radial-gradient(72% 58% at 50% 32%, rgba(152, 166, 143, .2), transparent 70%),
      linear-gradient(172deg, #fbf4ea 0%, #f4ebdf 100%);
    overflow: hidden;
  }

  .card { display: grid; justify-items: center; gap: 48px; }

  /* Das Blatt trägt seinen eigenen Cremeton — damit es nicht mit dem
     Papier verschwimmt, liegt der Kartengrund einen Hauch tiefer und
     die Kachel bekommt eine Haarlinie. */
  .tile {
    width: 384px; height: 384px;
    border-radius: 22%;
    overflow: hidden;
    background: #fdf9f3;
    box-shadow:
      0 26px 56px -20px rgba(62, 68, 46, .28),
      0 0 0 1px rgba(62, 68, 46, .09);
  }
  .tile img { display: block; width: 100%; height: 100%; }

  .word {
    font-family: "Lora", Georgia, serif;
    font-weight: 600;
    font-size: 68px;
    line-height: 1;
    letter-spacing: -.005em;
    color: #3e442e;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tile">
      <img src="../../assets/grow-into-life-logo.png" alt="">
    </div>
    <div class="word">Grow into Life</div>
  </div>
</body>
</html>
